<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset=".55" stop-color="#3a2516"/>
      <stop offset="1" stop-color="#24160d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfb2"/>
      <stop offset=".45" stop-color="#cfa465"/>
      <stop offset=".7" stop-color="#f0d9a6"/>
      <stop offset="1" stop-color="#b3843f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#c88a4c" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c88a4c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- capa de couro -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#leather)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)"/>
  <!-- filete dourado da capa -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="url(#gold)" stroke-width="7" opacity=".85"/>

  <!-- T com serifas: a haste termina como fita marcadora -->
  <path fill="url(#gold)" d="
    M128 132 H384 V196 H366 Q360 164 330 160 H290
    V372 L256 344 L222 372
    V160 H182 Q152 164 146 196 H128 Z"/>
</svg>
